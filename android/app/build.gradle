plugins {
    id "com.android.application"
    id "com.google.gms.google-services"  // FlutterFire
    id 'org.jetbrains.kotlin.android' 
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.unknown"
    compileSdkVersion 34  // Updated to 34 (Android 14), latest stable as of March 2025
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    defaultConfig {
        applicationId "com.example.unknown"
        minSdkVersion 23
        targetSdkVersion 34  // Updated to match compileSdkVersion
        versionCode 1
        versionName "1.0"
    }
    
    lintOptions {
        abortOnError false  // Prevents build from failing due to lint errors
        checkReleaseBuilds false  // Optional: Disable lint for release builds
        warningsAsErrors true  // Treat warnings as errors (optional)
        baseline file("lint-baseline.xml")  // Use baseline file to track issues
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug  // Debug signing for now
        }
    }
}

flutter {
    source "../.."
}

dependencies {
        implementation platform('com.google.firebase:firebase-bom:32.5.0')  // Firebase BoM
    implementation 'com.google.firebase:firebase-analytics'  // Example Firebase dependency
    implementation 'androidx.core:core-ktx:1.12.0'  // AndroidX Core
     implementation 'com.google.firebase:firebase-auth' 
     implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0"
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.1.0"

}